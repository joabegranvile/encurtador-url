services:
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: encurtador_url
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
